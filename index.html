<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amber — Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <div class="brand"><span class="dot"></span>Amber Calculator</div>

  <div class="calc">
    <div class="screen">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="backspace">⌫</button>
      <button class="fn" data-action="sign">±</button>
      <button class="op" data-action="op" data-op="÷">÷</button>

      <button data-action="num" data-num="7">7</button>
      <button data-action="num" data-num="8">8</button>
      <button data-action="num" data-num="9">9</button>
      <button class="op" data-action="op" data-op="×">×</button>

      <button data-action="num" data-num="4">4</button>
      <button data-action="num" data-num="5">5</button>
      <button data-action="num" data-num="6">6</button>
      <button class="op" data-action="op" data-op="−">−</button>

      <button data-action="num" data-num="1">1</button>
      <button data-action="num" data-num="2">2</button>
      <button data-action="num" data-num="3">3</button>
      <button class="op" data-action="op" data-op="+">+</button>

      <button class="span2" data-action="num" data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

  <div class="hint">
    Keyboard ready — digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
    <kbd>Enter</kbd> to equal, <kbd>Esc</kbd> to clear, <kbd>Backspace</kbd> to delete.
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
